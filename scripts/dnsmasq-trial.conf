# Phase 1 hardware trial — fog as DHCP + DNS for the camera segment (spec §3.1).
# Bench equivalent of the appliance: camera NIC -> unmanaged switch -> camera(s).
#
# The interface is NOT set here: discoveryTrialSegment.sh passes --interface so
# the NIC is named in exactly one place and the two files cannot disagree.
#
# bind-interfaces is what stops dnsmasq binding the wildcard address and
# answering DHCP on the real LAN. It is the reason serving DHCP from a dev
# machine is safe here, and it is not optional — spec §10.1 keeps dnsmasq out of
# the dev compose precisely because an unpinned DHCP server fights the LAN.
bind-interfaces
except-interface=lo

# Camera segment addressing (§3.1). 192.168.50.0/24 is deliberately neither
# 192.168.1.x nor 192.168.0.x, so a camera appearing here provably took our
# lease rather than falling back to a vendor static default (§3.2).
dhcp-range=192.168.50.50,192.168.50.150,12h
dhcp-authoritative

dhcp-option=3                 # no router — cameras get NO default route
dhcp-option=6,192.168.50.1    # DNS  = fog
dhcp-option=42,192.168.50.1   # NTP  = fog

# The path the lease discovery channel reads (DNSMASQ_LEASE_FILE default).
dhcp-leasefile=/var/lib/misc/dnsmasq.leases

# log-queries shows every name the camera resolves — free evidence for the §12.1
# egress story, since vendor cloud phone-home attempts appear here by name.
log-dhcp
log-queries
domain-needed
bogus-priv
